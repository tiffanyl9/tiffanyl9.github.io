<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tiffanyl9</title>
<style>
  :root{color-scheme:light dark}
  body{
    margin:0;min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#f7f7f8;color:#16181d;
  }
  @media (prefers-color-scheme:dark){body{background:#0f1115;color:#e9eaee}}
  a{color:#3b6ef5;font-weight:600;text-decoration:none}
  @media (prefers-color-scheme:dark){a{color:#5b86ff}}
  p{color:#6b7280;margin:0;font-size:14px}
</style>
</head>
<body>
  <p>Taking you to</p>
  <a href="/budget/" id="link">the budget app →</a>

<script>
// The app used to live here at the root. If a service worker from that version is still
// registered for "/", clear it out so this page can't be served from a stale cache —
// then move on to the new address. Registrations under /budget/ are left alone.
(async () => {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(
        regs
          .filter(r => new URL(r.scope).pathname === '/')
          .map(r => r.unregister())
      );
    }
  } catch (e) { /* nothing worth blocking the redirect for */ }
  location.replace('/budget/');
})();
</script>
</body>
</html>
